[project]
name = "agentic-commerce-dispute-resolver"
version = "0.1.0"
description = "Multi-agent system that triages and resolves disputes from AI purchasing agents (Stripe ACP-flavored)"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.1.0",
    "groq>=0.11.0",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.1",
    "duckduckgo-search>=6.3.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
